<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PawShop 数据大屏</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; background: #0f172a; color: #e2e8f0; }
  .panel { background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; }
  .bar { background: linear-gradient(90deg, #38bdf8, #0ea5e9); border-radius: 3px; height: 100%; min-width: 2px; transition: width .4s; }
  .bar2 { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
  .kpi-num { font-size: 1.6rem; font-weight: 700; }
  .up { color: #34d399; } .down { color: #f87171; }
  .blink { animation: blink 1.5s infinite; }
  @keyframes blink { 50% { opacity: .4; } }
</style>
</head>
<body class="min-h-screen p-4 md:p-6">

<!-- 顶栏 -->
<header class="flex flex-wrap items-center justify-between gap-3 mb-5">
  <div class="flex items-center gap-3">
    <div class="w-9 h-9 bg-sky-500 rounded-lg flex items-center justify-center"><i class="fas fa-chart-line text-white text-sm"></i></div>
    <h1 class="text-xl font-bold">PawShop 数据大屏</h1>
    <span class="text-xs text-emerald-400 flex items-center gap-1"><span class="w-1.5 h-1.5 bg-emerald-400 rounded-full blink"></span>实时</span>
  </div>
  <div class="flex items-center gap-4 text-sm text-slate-400">
    <span id="clock">--:--:--</span>
    <span><span id="refreshLeft">30</span>s 后刷新</span>
    <a href="admin.html" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs">返回后台</a>
  </div>
</header>

<!-- KPI -->
<div id="kpiRow" class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-3 mb-4"></div>

<!-- 异动 -->
<div id="alerts" class="space-y-2 mb-4"></div>

<div class="grid lg:grid-cols-3 gap-4">
  <!-- 趋势 -->
  <div class="panel p-5 lg:col-span-2">
    <div class="flex items-center justify-between mb-4">
      <h2 class="font-bold text-sm">近 14 天趋势</h2>
      <div class="flex gap-1 text-xs">
        <button onclick="setTrend('revenue')" id="trRev" class="px-3 py-1 rounded bg-sky-500 text-white">销售额</button>
        <button onclick="setTrend('orders')" id="trOrd" class="px-3 py-1 rounded bg-slate-700">订单量</button>
      </div>
    </div>
    <div id="trend" class="flex items-end gap-1.5 h-40"></div>
  </div>

  <!-- 漏斗 -->
  <div class="panel p-5">
    <h2 class="font-bold text-sm mb-4">转化漏斗</h2>
    <div id="funnel" class="space-y-3 text-sm"></div>
  </div>

  <!-- 排行 -->
  <div class="panel p-5 lg:col-span-2">
    <div class="flex items-center justify-between mb-4">
      <h2 class="font-bold text-sm">商品排行榜 <span class="text-[10px] text-slate-500 font-normal">点击穿透</span></h2>
      <div class="flex gap-1 text-xs">
        <button onclick="setRank('revenue')" id="rkRev" class="px-2.5 py-1 rounded bg-sky-500 text-white">销售额</button>
        <button onclick="setRank('orders')" id="rkOrd" class="px-2.5 py-1 rounded bg-slate-700">订单量</button>
        <button onclick="setRank('avg')" id="rkAvg" class="px-2.5 py-1 rounded bg-slate-700">成交均价</button>
      </div>
    </div>
    <div id="ranking" class="space-y-1"></div>
  </div>

  <!-- 地理 -->
  <div class="panel p-5">
    <h2 class="font-bold text-sm mb-4">地理分布(按国家)</h2>
    <div id="geo" class="space-y-2.5 text-sm"></div>
  </div>
</div>

<!-- AI 解读 -->
<div class="panel p-5 mt-4">
  <div class="flex items-center justify-between mb-3">
    <h2 class="font-bold text-sm"><i class="fas fa-brain text-xs mr-1.5"></i>AI 经营解读</h2>
    <button id="aiBtn" onclick="aiInsight()" class="px-4 py-2 bg-sky-500 text-white rounded-lg text-sm hover:bg-sky-400">一键生成解读</button>
  </div>
  <div id="aiOut" class="text-sm text-slate-300 leading-relaxed">点击按钮,AI 读取当前数据,输出经营状态、原因分析与建议。</div>
</div>

<p class="text-[11px] text-slate-500 mt-4 text-center">数据范围:本机浏览器可见的订单/预留(含测试单)。全设备订单聚合、流量与广告指标(GMV/点击率/LTV)依赖 P1 后端与流量统计接入后启用。</p>

<script>
const LS_ORDERS = 'pawshop_orders';
const LS_PRODUCTS = 'pawshop_products';
const LS_WAITLIST = 'pawshop_waitlist';

let trendMode = 'revenue';
let rankMode = 'revenue';

const $ = id => document.getElementById(id);
const getOrders = () => { try { return JSON.parse(localStorage.getItem(LS_ORDERS) || '[]'); } catch (e) { return []; } };
const getProducts = () => { try { const p = JSON.parse(localStorage.getItem(LS_PRODUCTS) || 'null'); return p || []; } catch (e) { return []; } };
const getWaitlist = () => { try { return JSON.parse(localStorage.getItem(LS_WAITLIST) || '[]'); } catch (e) { return []; } };

function dayKey(d) { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); }
function sameMonth(d, ref) { const a = new Date(d), b = ref; return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth(); }

function compute() {
  const orders = getOrders();
  const products = getProducts();
  const now = new Date();
  const today = dayKey(now);
  const yesterday = dayKey(new Date(now.getTime() - 864e5));
  const lastMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);

  const paid = orders; // 预售期:后台可见订单全部计入(含测试),诚实口径见页脚说明
  const revOf = list => list.reduce((s, o) => s + (o.total || 0), 0);
  const todayOrders = paid.filter(o => dayKey(o.createdAt) === today);
  const ydayOrders = paid.filter(o => dayKey(o.createdAt) === yesterday);
  const monthOrders = paid.filter(o => sameMonth(o.createdAt, now));
  const lastMonthOrders = paid.filter(o => sameMonth(o.createdAt, lastMonth));

  const marginOf = list => list.reduce((s, o) => {
    const cost = (o.items || []).reduce((c, i) => { const p = products.find(x => x.id === i.id); return c + ((p && p.costCNY ? p.costCNY : 0) / 7.15) * i.qty; }, 0);
    return s + (o.total || 0) - cost;
  }, 0);

  // 近14天序列
  const series = [];
  for (let i = 13; i >= 0; i--) {
    const d = dayKey(new Date(now.getTime() - i * 864e5));
    const list = paid.filter(o => dayKey(o.createdAt) === d);
    series.push({ day: d, revenue: revOf(list), orders: list.length });
  }

  // 商品排行
  const byProduct = {};
  for (const o of paid) for (const it of (o.items || [])) {
    if (!byProduct[it.id]) byProduct[it.id] = { id: it.id, name: it.name, revenue: 0, qty: 0 };
    byProduct[it.id].revenue += it.price * it.qty;
    byProduct[it.id].qty += it.qty;
  }
  const ranking = Object.values(byProduct).map(x => ({ ...x, avg: x.qty ? x.revenue / x.qty : 0 }));

  // 地理
  const geo = {};
  for (const o of paid) { const c = o.customer?.country || '未知'; geo[c] = (geo[c] || 0) + 1; }

  return { orders: paid, products, waitlist: getWaitlist(), todayOrders, ydayOrders, monthOrders, lastMonthOrders, series, ranking, geo, revOf, marginOf };
}

function delta(now, prev) { return prev > 0 ? ((now - prev) / prev * 100) : (now > 0 ? 100 : 0); }
function kpiCard(label, val, dlt) {
  const arrow = dlt === null ? '' : (dlt >= 0 ? `<span class="up text-xs">▲${dlt.toFixed(0)}%</span>` : `<span class="down text-xs">▼${Math.abs(dlt).toFixed(0)}%</span>`);
  return `<div class="panel p-4"><div class="text-xs text-slate-400 mb-1">${label}</div><div class="kpi-num">${val}</div>${arrow}</div>`;
}

function render() {
  const d = compute();

  $('kpiRow').innerHTML =
    kpiCard('今日销售额', '$' + d.revOf(d.todayOrders).toFixed(2), d.revOf(d.ydayOrders) > 0 || d.revOf(d.todayOrders) > 0 ? delta(d.revOf(d.todayOrders), d.revOf(d.ydayOrders)) : null) +
    kpiCard('今日订单', d.todayOrders.length, d.ydayOrders.length || d.todayOrders.length ? delta(d.todayOrders.length, d.ydayOrders.length) : null) +
    kpiCard('本月销售额', '$' + d.revOf(d.monthOrders).toFixed(2), d.revOf(d.lastMonthOrders) > 0 || d.revOf(d.monthOrders) > 0 ? delta(d.revOf(d.monthOrders), d.revOf(d.lastMonthOrders)) : null) +
    kpiCard('本月订单', d.monthOrders.length, null) +
    kpiCard('本月估算毛利', '$' + d.marginOf(d.monthOrders).toFixed(2), null) +
    kpiCard('待处理订单', d.orders.filter(o => o.status === 'new' || o.status === 'processing').length, null);

  // 趋势
  const max = Math.max(...d.series.map(x => x[trendMode] === 0 ? 1 : x[trendMode]), 1);
  $('trend').innerHTML = d.series.map(x => {
    const h = Math.max(2, (x[trendMode] / max) * 100);
    const val = trendMode === 'revenue' ? '$' + x.revenue.toFixed(0) : x.orders;
    return `<div class="flex-1 flex flex-col items-center justify-end h-full group relative">
      <div class="text-[9px] text-slate-400 mb-1 opacity-0 group-hover:opacity-100">${val}</div>
      <div class="w-full rounded-t" style="height:${h}%"><div class="bar w-full h-full"></div></div>
      <div class="text-[9px] text-slate-500 mt-1">${x.day.slice(5)}</div>
    </div>`;
  }).join('');

  // 漏斗
  const wl = d.waitlist.length, ords = d.orders.length;
  $('funnel').innerHTML = [
    ['预售登记', wl, 100],
    ['下单(本机可见)', ords, wl ? Math.max(4, ords / wl * 100) : 0],
  ].map(([label, n, pct]) => `
    <div>
      <div class="flex justify-between text-xs mb-1"><span class="text-slate-300">${label}</span><span>${n}</span></div>
      <div class="h-4 bg-slate-800 rounded"><div class="bar h-full" style="width:${Math.min(100, pct)}%"></div></div>
    </div>`).join('') +
    `<div class="text-xs text-slate-400 pt-1">预留→下单转化:${wl ? (ords / wl * 100).toFixed(0) : 0}%</div>`;

  // 排行
  const rk = [...d.ranking].sort((a, b) => b[rankMode === 'revenue' ? 'revenue' : rankMode === 'orders' ? 'qty' : 'avg'] - a[rankMode === 'revenue' ? 'revenue' : rankMode === 'orders' ? 'qty' : 'avg']).slice(0, 8);
  const rkMax = Math.max(...rk.map(x => rankMode === 'revenue' ? x.revenue : rankMode === 'orders' ? x.qty : x.avg), 1);
  $('ranking').innerHTML = rk.length ? rk.map((x, i) => `
    <div onclick="drill(${x.id})" class="p-2 rounded-lg hover:bg-slate-700/50 cursor-pointer">
      <div class="flex items-center gap-2 text-sm">
        <span class="w-5 text-center text-xs ${i < 3 ? 'text-amber-400 font-bold' : 'text-slate-500'}">${i + 1}</span>
        <span class="flex-1 truncate">${x.name}</span>
        <span class="font-mono text-xs">${rankMode === 'revenue' ? '$' + x.revenue.toFixed(2) : rankMode === 'orders' ? x.qty + ' 单' : '$' + x.avg.toFixed(2)}</span>
      </div>
      <div class="h-1.5 mt-1.5 bg-slate-800 rounded"><div class="bar2 h-full rounded" style="width:${((rankMode === 'revenue' ? x.revenue : rankMode === 'orders' ? x.qty : x.avg) / rkMax) * 100}%"></div></div>
      <div id="drill-${x.id}" class="hidden text-xs text-slate-400 mt-2 pl-7"></div>
    </div>`).join('') : '<div class="text-sm text-slate-500 py-8 text-center">暂无订单数据</div>';

  // 地理
  const geoArr = Object.entries(d.geo).sort((a, b) => b[1] - a[1]);
  const geoMax = Math.max(...geoArr.map(x => x[1]), 1);
  $('geo').innerHTML = geoArr.length ? geoArr.map(([c, n]) => `
    <div class="flex items-center gap-2">
      <span class="w-14 text-xs text-slate-400">${c}</span>
      <div class="flex-1 h-3 bg-slate-800 rounded"><div class="bar h-full rounded" style="width:${n / geoMax * 100}%"></div></div>
      <span class="text-xs">${n}</span>
    </div>`).join('') : '<div class="text-sm text-slate-500 py-4 text-center">暂无数据</div>';

  // 异动
  const alerts = [];
  const dr = delta(d.revOf(d.todayOrders), d.revOf(d.ydayOrders));
  if (d.revOf(d.ydayOrders) > 0 && Math.abs(dr) >= 30) alerts.push(`今日销售额较昨日${dr > 0 ? '大增' : '大跌'} ${Math.abs(dr).toFixed(0)}%——${dr > 0 ? '检查是否单一订单拉高,确认可复制原因' : '检查流量/上架状态是否变化'}`);
  const dm = delta(d.revOf(d.monthOrders), d.revOf(d.lastMonthOrders));
  if (d.revOf(d.lastMonthOrders) > 0 && Math.abs(dm) >= 30) alerts.push(`本月销售额环比${dm > 0 ? '上升' : '下降'} ${Math.abs(dm).toFixed(0)}%`);
  const zeroCost = d.products.filter(p => p.active !== false && !p.costCNY).length;
  if (zeroCost) alerts.push(`${zeroCost} 个在售商品未录采购成本——毛利统计偏低,请在后台补录`);
  $('alerts').innerHTML = alerts.length ? alerts.map(t => `<div class="panel p-3 text-sm text-amber-300 border-amber-600/30"><i class="fas fa-triangle-exclamation text-xs mr-2"></i>${t}</div>`).join('') : '';
}

function drill(id) {
  const el = $('drill-' + id);
  if (!el) return;
  if (!el.classList.contains('hidden')) { el.classList.add('hidden'); return; }
  const d = compute();
  const orders = d.orders.filter(o => (o.items || []).some(i => i.id === id));
  const p = d.products.find(x => x.id === id);
  const rev = orders.reduce((s, o) => s + (o.items.filter(i => i.id === id).reduce((a, i) => a + i.price * i.qty, 0)), 0);
  const qty = orders.reduce((s, o) => s + o.items.filter(i => i.id === id).reduce((a, i) => a + i.qty, 0), 0);
  const margin = p && p.costCNY ? rev - (p.costCNY / 7.15) * qty : null;
  el.innerHTML = `订单 ${orders.length} 笔 · 销量 ${qty} · 销售额 $${rev.toFixed(2)}${margin !== null ? ` · 估算毛利 $${margin.toFixed(2)}` : ' · <span class="text-amber-400">未录成本</span>'} · 供应商:${p && p.supplier ? p.supplier : '未设置'} · 最近一单:${orders.length ? new Date(orders[orders.length - 1].createdAt).toLocaleString('zh-CN') : '—'}`;
  el.classList.remove('hidden');
}

function setTrend(m) { trendMode = m; $('trRev').className = 'px-3 py-1 rounded ' + (m === 'revenue' ? 'bg-sky-500 text-white' : 'bg-slate-700'); $('trOrd').className = 'px-3 py-1 rounded ' + (m === 'orders' ? 'bg-sky-500 text-white' : 'bg-slate-700'); render(); }
function setRank(m) { rankMode = m; ['rkRev', 'rkOrd', 'rkAvg'].forEach((id, i) => { $(id).className = 'px-2.5 py-1 rounded ' + ((i === 0 && m === 'revenue') || (i === 1 && m === 'orders') || (i === 2 && m === 'avg') ? 'bg-sky-500 text-white' : 'bg-slate-700'); }); render(); }

// AI 经营解读
async function aiInsight() {
  const key = localStorage.getItem('pawshop_glm_key');
  const btn = $('aiBtn'), out = $('aiOut');
  if (!key) { out.textContent = '请先在后台"数据"页配置 GLM API Key。'; return; }
  btn.innerHTML = '<i class="fas fa-spinner fa-spin text-xs mr-1"></i>解读中...'; btn.disabled = true;
  const d = compute();
  const stats = {
    今日: { 销售额: +d.revOf(d.todayOrders).toFixed(2), 订单数: d.todayOrders.length },
    昨日: { 销售额: +d.revOf(d.ydayOrders).toFixed(2), 订单数: d.ydayOrders.length },
    本月: { 销售额: +d.revOf(d.monthOrders).toFixed(2), 订单数: d.monthOrders.length, 估算毛利: +d.marginOf(d.monthOrders).toFixed(2) },
    近14天销售额序列: d.series.map(x => x.revenue),
    商品排行: [...d.ranking].sort((a, b) => b.revenue - a.revenue).slice(0, 5).map(x => ({ 名称: x.name, 销售额: +x.revenue.toFixed(2), 销量: x.qty })),
    预售登记数: d.waitlist.length, 在售商品数: d.products.filter(p => p.active !== false).length,
    地理分布: d.geo,
  };
  try {
    const r = await fetch('https://open.bigmodel.cn/api/paas/v4/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + key },
      body: JSON.stringify({
        model: localStorage.getItem('pawshop_glm_model') || 'glm-4.7-flash',
        messages: [
          { role: 'system', content: '你是跨境电商数据分析师。基于给出的 JSON 经营数据,用中文输出:1)当前经营状态一句话 2)2-3条关键发现(含数据异动原因猜测,注明是猜测) 3)2-3条可执行建议。数据量小就直说样本不足,不要编造趋势。控制在200字内。' },
          { role: 'user', content: JSON.stringify(stats) },
        ],
        temperature: 0.4, max_tokens: 500,
      }),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    out.innerHTML = (j.choices?.[0]?.message?.content || '无返回').replace(/\n/g, '<br>');
  } catch (e) { out.textContent = '解读失败: ' + e.message + '(高峰繁忙可稍后再试)'; }
  btn.innerHTML = '一键生成解读'; btn.disabled = false;
}

// 时钟与自动刷新
let left = 30;
setInterval(() => {
  $('clock').textContent = new Date().toLocaleTimeString('zh-CN');
  left--; $('refreshLeft').textContent = left;
  if (left <= 0) { left = 30; render(); }
}, 1000);
window.addEventListener('storage', e => { if (e.key === LS_ORDERS || e.key === LS_PRODUCTS || e.key === LS_WAITLIST) { left = 30; render(); } });

render();
</script>

</body>
</html>
