<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>PawShop 运营后台迁移中</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #0f172a; background: #f8fafc; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    main { width: min(520px, 100%); background: white; border: 1px solid #e2e8f0; border-radius: 18px; padding: 32px; box-sizing: border-box; box-shadow: 0 12px 36px rgba(15, 23, 42, .06); }
    .mark { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 12px; background: #0f172a; color: white; font-weight: 800; }
    h1 { margin: 20px 0 10px; font-size: 24px; }
    p { color: #475569; line-height: 1.7; }
    .notice { margin: 20px 0; padding: 14px 16px; border-radius: 12px; background: #fefce8; color: #854d0e; font-size: 14px; }
    a { display: inline-block; padding: 11px 16px; border-radius: 10px; background: #0f172a; color: white; text-decoration: none; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">P</div>
    <h1>运营后台正在安全迁移</h1>
    <p>旧后台依赖浏览器本地数据，不能安全管理真实顾客、订单或服务密钥，因此已停止公网使用。</p>
    <div class="notice">目前 PawShop 处于预发布展示阶段，尚未开放付款和订单处理。</div>
    <p>正式运营后台将用于商品、SKU、库存、订单、物流和退款管理，并采用服务端身份验证。</p>
    <a href="PawShop.html">返回 PawShop</a>
  </main>
</body>
</html>
