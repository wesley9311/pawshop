limit_req_zone $binary_remote_addr zone=pawshop_admin_api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=pawshop_admin_login:10m rate=10r/m;

# Admin console UI (2026-09-19). The UI is the stock Medusa admin: one address
# loads a shell plus its hashed chunks, and a first paint pulls a burst of them,
# so this budget is far above human use (same reasoning as the store zone) while
# still bounding an automated client that finds the path. The API calls the UI
# then makes stay under pawshop_admin_api.
limit_req_zone $binary_remote_addr zone=pawshop_console_ui:10m rate=600r/m;
