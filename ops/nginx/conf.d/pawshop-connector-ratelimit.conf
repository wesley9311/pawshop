# CloudGull Connector API V1.1 rate limit (2026-09-27).
#
# The connector is a server-to-server surface: CloudGull, not a browser, is the
# client. Its product syncs arrive in small bursts from essentially one egress
# address per environment, so the budget has to sit comfortably above a genuine
# sync while still bounding a scanner that finds the path.
#
# This limit is NOT the security boundary. Every request is authenticated by an
# HMAC request signature over the body, a service token, a scope check and a
# replay guard, all enforced by the connector itself. The rate limit only caps
# how hard an unauthenticated caller can knock.
#
# Deliberately its own file rather than an addition to an existing zone file, so
# this change stays isolated and can be reverted by deleting one file plus one
# `location` block.
limit_req_zone $binary_remote_addr zone=pawshop_connector:10m rate=120r/m;
