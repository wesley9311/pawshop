# Customer auth rate limit (Rollout D, 2026-10-05).
# Customer registration/login (/auth/customer/*) and email verification
# (/auth/verification/*) are the two namespaces a shopper's own browser hits to
# establish a customer session. Both are bounded by one zone, mirroring the
# admin-login budget: a human never hits it, but it bounds an automated client
# enumerating emails or brute-forcing passwords. The backend adds its own inner
# rate limit on verification codes (60s cooldown + per-IP cap), so this nginx
# zone is the outer envelope only.
limit_req_zone $binary_remote_addr zone=pawshop_customer_login:10m rate=10r/m;
