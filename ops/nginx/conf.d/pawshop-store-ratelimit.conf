# Public Store API rate limit (P0-4, 2026-09-19).
# A storefront page issues several API calls by itself, so a real shopper must
# never be throttled: the budget is far above human browsing while still bounding
# an automated client that discovers the endpoint. The monitor probes from
# loopback, which is its own bucket and cannot exhaust a shopper's allowance.
limit_req_zone $binary_remote_addr zone=pawshop_store_api:10m rate=600r/m;

# PayPal webhook ingress (2026-09-27). PayPal POSTs each payment event to
# /hooks/payment/paypal, occasionally with retries. The real security boundary is
# the provider's signature verification (Medusa's webhook route does not verify
# the transmission), not this rate limit — the limit only bounds an automated
# scanner. PayPal's own egress IPs share few source addresses, so keep the budget
# comfortably above a burst of genuine events plus retries.
# The zone covers both the short alias path (/hooks/payment/paypal, what the
# PayPal dashboard is configured with) and the canonical provider path
# (/hooks/payment/paypal_paypal) — see sites-available/pawshop for why both exist.
limit_req_zone $binary_remote_addr zone=pawshop_webhook:10m rate=120r/m;
