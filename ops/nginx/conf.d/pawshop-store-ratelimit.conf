# Public Store API rate limit (P0-4, 2026-09-19).
# A storefront page issues several API calls by itself, so a real shopper must
# never be throttled: the budget is far above human browsing while still bounding
# an automated client that discovers the endpoint. The monitor probes from
# loopback, which is its own bucket and cannot exhaust a shopper's allowance.
limit_req_zone $binary_remote_addr zone=pawshop_store_api:10m rate=600r/m;
