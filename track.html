<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Your Order - PawShop</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
</style>
</head>
<body class="bg-white text-slate-900 min-h-screen flex flex-col">

<nav class="border-b border-slate-100">
  <div class="max-w-xl mx-auto px-4 h-16 flex items-center justify-between">
    <a href="PawShop.html" class="text-xl font-bold">PawShop</a>
    <a href="PawShop.html" class="text-sm text-slate-500 hover:text-slate-900">Continue shopping <i class="fas fa-arrow-right text-xs ml-1"></i></a>
  </div>
</nav>

<main class="flex-1 max-w-xl w-full mx-auto px-4 py-16">
  <h1 class="text-2xl font-bold mb-2">Track your order</h1>
  <p class="text-sm text-slate-500 mb-8">Enter the order number from your confirmation (e.g. PO1724...).</p>

  <div class="flex gap-2 mb-10">
    <input type="text" id="orderInput" placeholder="Order number" class="flex-1 px-4 py-3 border border-slate-200 rounded-lg text-sm font-mono" onkeydown="if(event.key==='Enter')trackOrder()">
    <button onclick="trackOrder()" class="px-6 py-3 bg-slate-900 text-white text-sm rounded-lg hover:bg-slate-700">Track</button>
  </div>

  <div id="result"></div>
</main>

<footer class="bg-slate-900 text-white py-6 text-center text-sm text-slate-400">
  &copy; 2026 PawShop. All rights reserved.
</footer>

<script>
const STATUS_LABELS = {
  new: 'Order received',
  processing: 'Being prepared',
  shipped: 'Shipped',
  done: 'Delivered',
};
const STATUS_STEPS = ['new', 'processing', 'shipped', 'done'];

function getOrders() {
  try { return JSON.parse(localStorage.getItem('pawshop_orders') || '[]'); } catch (e) { return []; }
}

function trackOrder() {
  const id = document.getElementById('orderInput').value.trim();
  const box = document.getElementById('result');
  if (!id) return;

  const order = getOrders().find(o => o.id === id);
  if (!order) {
    box.innerHTML = `
      <div class="border border-slate-200 rounded-lg p-6 text-center">
        <i class="fas fa-search text-2xl text-slate-300 mb-3"></i>
        <p class="text-sm text-slate-500">No order found for "${id}". Please check your confirmation email.</p>
      </div>`;
    return;
  }

  const currentIdx = STATUS_STEPS.indexOf(order.status || 'new');
  const history = order.history || [{ status: order.status || 'new', at: order.createdAt }];

  box.innerHTML = `
    <div class="border border-slate-100 rounded-lg overflow-hidden">
      <div class="bg-slate-50 px-6 py-4 flex items-center justify-between">
        <div>
          <div class="text-xs text-slate-400">Order</div>
          <div class="font-mono font-bold">${order.id}</div>
        </div>
        <div class="text-sm font-medium ${order.status === 'done' ? 'text-green-600' : ''}">${STATUS_LABELS[order.status] || order.status}</div>
      </div>
      <div class="px-6 py-6">
        <div class="flex items-center mb-8">
          ${STATUS_STEPS.map((s, i) => `
            <div class="flex items-center ${i < STATUS_STEPS.length - 1 ? 'flex-1' : ''}">
              <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs flex-shrink-0 ${i <= currentIdx ? 'bg-green-500 text-white' : 'bg-slate-100 text-slate-400'}">
                ${i <= currentIdx ? '<i class="fas fa-check"></i>' : i + 1}
              </div>
              ${i < STATUS_STEPS.length - 1 ? `<div class="h-0.5 flex-1 mx-1 ${i < currentIdx ? 'bg-green-500' : 'bg-slate-100'}"></div>` : ''}
            </div>
          `).join('')}
        </div>
        <div class="flex justify-between text-xs text-slate-400 mb-8 -mt-6 px-0">
          ${STATUS_STEPS.map((s, i) => `<div class="${i === STATUS_STEPS.length - 1 ? '' : 'flex-1'} ${i <= currentIdx ? 'text-green-600 font-medium' : ''}">${STATUS_LABELS[s]}</div>`).join('')}
        </div>

        ${order.tracking ? `
        <div class="bg-slate-50 rounded p-4 mb-6 text-sm">
          <span class="text-slate-400">Carrier:</span> ${order.tracking.carrier}
          <span class="text-slate-400 ml-4">Tracking:</span> <span class="font-mono">${order.tracking.number}</span>
        </div>` : ''}

        <div class="text-sm space-y-2">
          ${(order.items || []).map(i => `
            <div class="flex justify-between">
              <span class="text-slate-600">${i.name} ×${i.qty}</span>
              <span>$${(i.price * i.qty).toFixed(2)}</span>
            </div>`).join('')}
          <div class="flex justify-between font-bold pt-2 border-t border-slate-100">
            <span>Total</span><span>$${(order.total || 0).toFixed(2)}</span>
          </div>
        </div>
      </div>
    </div>
  `;
}
</script>

</body>
</html>
